baseURL = 'https://lilaartscentre.com/'
locale = 'en-in'
title = 'Lila Arts Centre'

# Every root-level key must sit above the first [table]. These used to live
# below [module], which parsed them as module.disableKinds and friends, so
# Hugo never saw them: taxonomy pages and an RSS feed were built regardless.

# Mostly a one-page website, but /events/ is a real section with dated pages,
# so `section` and `RSS` stay enabled. Taxonomies have no templates.
disableKinds = ["taxonomy", "term", "robotsTXT"]

# Programmes are announced ahead of time; future-dated pages must still build.
buildFuture = true

# Was silently inert under [module] and the site never showed it; leaving it
# on would newly print "version: <date> | #<sha>" in the footer.
enableGitInfo = false
enableEmoji = true

[module]
[[module.imports]]
path = "github.com/zjedi/hugo-scroll"

# The homepage stays a single scrolling page; only /events/ carries a feed
# and a calendar subscription.
[outputs]
home = ["html"]
section = ["html", "rss", "calendar"]
page = ["html"]

[outputFormats.calendar]
mediaType = "text/calendar"
baseName = "events"
isPlainText = true
protocol = "webcal://"

[permalinks]
events = "/events/:year/:slug/"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
# Favicon
favicon = "images/favicon.png"

# Open Graph / Social sharing image
images = ["images/cover.jpg"]

# Site title for Open Graph
title = "Lila Arts Centre - Dance Studio & Performance Space in Chennai"

# Meta description
description = "A performance space and dance studio in the heart of Chennai, offering Bharatanatyam classes, workshops, and venue hire."

# Copyright line in footer
copyright = "© Lila Arts Centre, Chennai"

# Don't hide the theme credit
hidedesignbyline = false

# Section color alternation
invertSectionColors = false

# Image processing options
image_options = "webp q90 lanczos photo"

[params.footer]
showContactIcons = true
showFooterLinks = false

[params.meta]
keywords = "dance studio chennai, bharatanatyam classes, performance space chennai, lila arts centre, t nagar dance, indian classical dance, dance workshops chennai"

