/* Contact form styles */
#contact-form {
  max-width: 500px;
  margin: 2rem 0;
}
#contact-form form {
  display: flex;
  flex-direction: column;
}
#contact-form label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 500;
}
#contact-form input,
#contact-form textarea,
#contact-form select {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 1rem;
  border: 1px solid #C9C2B5;
  border-radius: 4px;
  font-size: 1rem;
  font-family: inherit;
  box-sizing: border-box;
}
#contact-form textarea {
  min-height: 150px;
  resize: vertical;
}
#contact-form button,
#contact-form input[type="submit"] {
  background: #C4A265;
  color: #1A1A1A;
  padding: 0.75rem 2rem;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.2s;
  align-self: flex-start;
}
#contact-form button:hover,
#contact-form input[type="submit"]:hover {
  background: #D4B275;
}
#contact-form button:disabled,
#contact-form input[type="submit"]:disabled {
  background: #8A7D6B;
  color: #D0C9BE;
  cursor: not-allowed;
}
